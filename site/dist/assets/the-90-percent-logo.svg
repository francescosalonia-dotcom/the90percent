<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">The 90 Percent — matrice 3 per 3 con unità separata</title>
<desc id="desc">A sinistra il wordmark THE 90 PERCENT; subito a destra una matrice 3 per 3 di nove quadrati blu e un quadrato giallo separato, allineato alla riga inferiore. Dieci unità in tutto.</desc>
